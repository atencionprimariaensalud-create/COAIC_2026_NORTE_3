<!DOCTYPE html>
<html lang="es" class="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1830" />
<title>PIC 2026 · E.S.E. Norte 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#F4F7FD; --surface:#FFFFFF; --surface2:#F7FAFF; --surface3:#EEF4FE;
    --border:#DFE9F7; --border2:#CBDCF3;
    --text:#0A1526; --text2:#3A4E6B; --muted:#69809F;
    --brand:#1B5BC9; --brand2:#0E3F93; --brand3:#2F76E8; --accent:#38BDF8;
    --ok:#0E9F6E; --warn:#D97706; --bad:#E11D48; --ring:rgba(47,118,232,.22);
    --shadow:0 1px 2px rgba(10,21,38,.05), 0 12px 32px -20px rgba(10,21,38,.35);
    --shadow-lg:0 2px 6px rgba(10,21,38,.06), 0 32px 64px -32px rgba(10,21,38,.45);
  }
  html.dark{
    --bg:#060D1B; --surface:#0C1930; --surface2:#101F3A; --surface3:#152746;
    --border:#1D3255; --border2:#27436E;
    --text:#E9F0FB; --text2:#B7C8E2; --muted:#7E96B8;
    --brand:#4C8DF6; --brand2:#2F76E8; --brand3:#6AA5FA; --accent:#38BDF8;
    --ring:rgba(76,141,246,.28);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -24px rgba(0,0,0,.9);
    --shadow-lg:0 2px 10px rgba(0,0,0,.5), 0 40px 80px -40px rgba(0,0,0,1);
  }
  *{box-sizing:border-box;min-width:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,'Segoe UI',sans-serif;
       -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
  .bgmesh{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 480px at 8% -8%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 60%),
      radial-gradient(760px 420px at 96% 4%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 62%),
      radial-gradient(700px 500px at 60% 110%, color-mix(in srgb, var(--brand2) 12%, transparent), transparent 60%);}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  ::-webkit-scrollbar{height:9px;width:9px}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

  .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--border)}
  .brandmark{background:linear-gradient(135deg,var(--brand3),var(--brand2));box-shadow:0 10px 24px -12px color-mix(in srgb,var(--brand) 70%, transparent)}

  .seg{display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--surface3);border:1px solid var(--border);overflow-x:auto;max-width:100%}
  .seg button{border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text2);transition:.18s;white-space:nowrap}
  .seg button:hover{color:var(--brand)}
  .seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);transition:.22s}
  .kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);transition:.22s}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand3)}
  .kpi.ok:before{background:linear-gradient(180deg,#34D399,var(--ok))}
  .kpi.warn:before{background:linear-gradient(180deg,#FBBF24,var(--warn))}
  .kpi.bad:before{background:linear-gradient(180deg,#FB7185,var(--bad))}
  .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface3);color:var(--brand);flex:0 0 auto}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-size:12.5px;font-weight:600;padding:8px 12px;transition:.16s;border:1px solid transparent;white-space:nowrap}
  .btn-primary{background:linear-gradient(135deg,var(--brand3),var(--brand2));color:#fff;box-shadow:0 12px 24px -14px color-mix(in srgb,var(--brand) 80%, transparent)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-ghost{background:var(--surface);border-color:var(--border2);color:var(--text2)}
  .btn-ghost:hover{background:var(--surface2);color:var(--brand)}
  .btn-danger{background:color-mix(in srgb,var(--bad) 10%, var(--surface));border-color:color-mix(in srgb,var(--bad) 28%, transparent);color:var(--bad)}

  .field{width:100%;border:1px solid var(--border2);border-radius:11px;background:var(--surface);padding:9px 12px;font-size:13px;color:var(--text);transition:.15s}
  .field:focus{outline:none;border-color:var(--brand3);box-shadow:0 0 0 4px var(--ring)}
  .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .chip{display:inline-block;border-radius:999px;font-size:10.5px;font-weight:700;padding:2px 8px;background:var(--surface3);color:var(--brand);border:1px solid var(--border);white-space:nowrap}
  .bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  .strat{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
  .strat>summary{list-style:none;cursor:pointer;display:block}
  .strat>summary::-webkit-details-marker{display:none}
  .strip{width:5px;border-radius:99px;flex:0 0 5px;background:var(--brand3)}

  /* tablas: siempre con scroll propio y ancho mínimo para que no se monten las columnas */
  .tblwrap{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;width:100%}
  table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;min-width:900px}
  table.mtx{min-width:1020px}
  th{background:var(--surface2);color:var(--text2);font-weight:800;font-size:10px;letter-spacing:.06em;
     text-transform:uppercase;text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:bottom}
  td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text);word-break:break-word}
  tbody tr:hover{background:var(--surface2)}
  tfoot td{background:var(--surface3);border-top:1px solid var(--border2);font-weight:700}
  .stickycol{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--border)}
  tr:hover .stickycol{background:var(--surface2)}
  tfoot .stickycol{background:var(--surface3)}
  input.cant{width:64px;border:1px solid var(--border2);border-radius:8px;padding:5px 6px;text-align:right;font-size:12px;
             background:var(--surface);color:var(--text);font-variant-numeric:tabular-nums}
  input.cant:focus{outline:none;border-color:var(--brand3);box-shadow:0 0 0 3px var(--ring)}
  input.cant.filled{background:color-mix(in srgb,var(--ok) 12%, var(--surface));border-color:color-mix(in srgb,var(--ok) 45%, transparent);color:var(--ok)}

  .donut{transform:rotate(-90deg)}
  .donut circle{fill:none;stroke-linecap:round}
  .toast{position:fixed;right:14px;bottom:64px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:90vw}
  .toast div{background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:12px;padding:10px 14px;
             font-size:12.5px;box-shadow:var(--shadow-lg);animation:pop .25s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dock{position:sticky;bottom:0;z-index:30;background:color-mix(in srgb, var(--surface) 88%, transparent);
        backdrop-filter:blur(14px);border-top:1px solid var(--border)}

  @media (max-width:640px){
    table{min-width:760px}
    .kpi{padding:12px 13px}
    .kpi .text-\[18px\]{font-size:15px}
  }
  @media print{
    .no-print,.dock,.toast{display:none!important}
    body{background:#fff;color:#000}
    .topbar{position:static;background:#fff;border:0}
    .card,.kpi,.strat{box-shadow:none;border-color:#CBD5E1}
    .tblwrap{overflow:visible}
    table{min-width:0!important}
    th{background:#F1F5F9;color:#000}
    .bgmesh{display:none}
  }
</style>
</head>
<body class="min-h-screen">
<div class="bgmesh"></div>

<header class="topbar no-print">
  <div class="max-w-[1560px] mx-auto px-3 sm:px-4 py-2 flex items-center gap-2 sm:gap-3">
    <div class="w-9 h-9 rounded-xl brandmark grid place-items-center shrink-0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M12 10.5v5.5"/><path d="M9.25 13.25h5.5"/>
      </svg>
    </div>
    <div class="leading-tight shrink-0">
      <div class="text-[12.5px] font-extrabold tracking-tight">PIC 2026</div>
      <div class="text-[9.5px] font-semibold tracking-wide" style="color:var(--muted)">E.S.E. NORTE 3</div>
    </div>
    <div class="seg ml-1 hidden md:inline-flex" id="tabs">
      <button data-tab="cal" class="on">Calificación</button>
      <button data-tab="res">Tablero</button>
      <button data-tab="acta">Acta</button>
    </div>
    <div class="ml-auto flex items-center gap-1.5">
      <button id="btnSearch" class="btn btn-ghost hidden sm:inline-flex" title="Buscar (Ctrl K)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="text-[11px]">Buscar</span>
      </button>
      <button id="btnTheme" class="btn btn-ghost" title="Cambiar tema">
        <svg id="icoSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg id="icoMoon" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>
  <div class="px-3 pb-2 md:hidden">
    <div class="seg w-full" id="tabsMobile" style="display:flex">
      <button data-tab="cal" class="on flex-1">Calificación</button>
      <button data-tab="res" class="flex-1">Tablero</button>
      <button data-tab="acta" class="flex-1">Acta</button>
    </div>
  </div>
</header>

<main class="max-w-[1560px] mx-auto px-3 sm:px-4 py-4 sm:py-5 space-y-4 sm:space-y-5">

  <div id="tabCal" class="space-y-4 sm:space-y-5">

    <section class="card p-3 sm:p-4 no-print">
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
        <div>
          <span class="lbl">Municipio</span>
          <div class="relative mt-1.5">
            <svg class="absolute left-3 top-2.5" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/></svg>
            <select id="fMuni" class="field pl-9"></select>
          </div>
        </div>
        <div>
          <span class="lbl">Estrategia</span>
          <div class="relative mt-1.5">
            <svg class="absolute left-3 top-2.5" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V9"/><path d="M12 16v-4"/><path d="M16 16V7"/></svg>
            <select id="fEstr" class="field pl-9"></select>
          </div>
        </div>
        <div>
          <span class="lbl">Estado</span>
          <select id="fEstado" class="field mt-1.5">
            <option value="todas">Todos</option>
            <option value="con">Con avance</option>
            <option value="sin">Sin avance</option>
          </select>
        </div>
        <div>
          <span class="lbl">Buscar</span>
          <div class="relative mt-1.5">
            <svg class="absolute left-3 top-2.5" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="fTexto" type="search" placeholder="Entregable, actividad o mes…" class="field pl-9" />
          </div>
        </div>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <button id="btnXlsx" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> Excel (.xlsx)
        </button>
        <button id="btnPrint" class="btn btn-ghost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/></svg> PDF
        </button>
        <button id="btnReset" class="btn btn-danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg> Restablecer
        </button>
      </div>
    </section>

    <section class="grid grid-cols-2 lg:grid-cols-5 gap-3">
      <div class="kpi">
        <div class="flex items-start justify-between gap-2"><span class="lbl">Valor</span>
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span></div>
        <div class="text-[15px] sm:text-[17px] font-extrabold num mt-1 break-words" id="kTotal">—</div>
        <div class="text-[10px] mt-0.5" style="color:var(--muted)" id="kPeso"></div>
      </div>
      <div class="kpi ok">
        <div class="flex items-start justify-between gap-2"><span class="lbl">Ejecutado</span>
          <span class="ico" style="color:var(--ok)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18V9"/><path d="M10 18V5"/><path d="M16 18v-6"/><path d="M22 18H2"/></svg></span></div>
        <div class="text-[15px] sm:text-[17px] font-extrabold num mt-1 break-words" id="kEjec">—</div>
        <div class="text-[10px] mt-0.5" style="color:var(--muted)" id="kPend"></div>
      </div>
      <div class="kpi" id="kpiPct">
        <div class="flex items-start justify-between gap-2"><span class="lbl">% ejecución</span>
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M19 5 5 19"/></svg></span></div>
        <div class="text-[15px] sm:text-[17px] font-extrabold num mt-1" id="kPct">—</div>
        <div class="bar mt-2"><span id="kBar" style="width:0%"></span></div>
      </div>
      <div class="kpi">
        <div class="flex items-start justify-between gap-2"><span class="lbl">Productos</span>
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span></div>
        <div class="text-[15px] sm:text-[17px] font-extrabold num mt-1" id="kProds">—</div>
        <div class="text-[10px] mt-0.5" style="color:var(--muted)" id="kProdsAv"></div>
      </div>
      <div class="kpi">
        <div class="flex items-start justify-between gap-2"><span class="lbl">Unidades</span>
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18"/><path d="M6 7v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/><path d="M9 11v4"/><path d="M15 11v4"/></svg></span></div>
        <div class="text-[15px] sm:text-[17px] font-extrabold num mt-1" id="kUnid">—</div>
        <div class="text-[10px] mt-0.5" style="color:var(--muted)" id="kUnidAv"></div>
      </div>
    </section>

    <section id="contenedor" class="space-y-3"></section>
  </div>

  <section id="tabRes" class="hidden space-y-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="card p-4 sm:p-5">
        <div class="lbl">Distribución del PIC</div>
        <div class="flex flex-col sm:flex-row items-center gap-4 mt-3">
          <svg viewBox="0 0 42 42" class="donut w-[128px] h-[128px] shrink-0" id="donut"></svg>
          <div class="text-[11.5px] space-y-1.5 w-full" id="donutLegend"></div>
        </div>
      </div>
      <div class="card p-4 sm:p-5 lg:col-span-2">
        <div class="flex items-center justify-between gap-2">
          <div class="lbl">Avance por estrategia</div>
          <span class="text-[10.5px]" style="color:var(--muted)" id="resInfo"></span>
        </div>
        <div id="barras" class="mt-3 space-y-2"></div>
      </div>
    </div>

    <div class="card p-4 sm:p-5 flex flex-wrap items-center gap-3">
      <div>
        <h2 class="text-[14px] font-extrabold tracking-tight">Matriz estrategia × municipio</h2>
        <p class="text-[11px]" style="color:var(--muted)">Valor y % de ejecución en dinero.</p>
      </div>
      <button id="btnXlsxRes" class="btn btn-primary ml-auto no-print">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> Excel (.xlsx)
      </button>
    </div>
    <div class="card overflow-hidden">
      <div id="resTabla" class="tblwrap"></div>
    </div>
  </section>

  <section id="tabActa" class="hidden space-y-4">
    <div class="card p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 no-print">
      <label class="block"><span class="lbl">Fecha de corte</span>
        <input id="actaFecha" type="date" class="field mt-1.5" /></label>
      <label class="block"><span class="lbl">Municipio</span>
        <select id="actaMuni" class="field mt-1.5"></select></label>
      <label class="block"><span class="lbl">Elaboró</span>
        <input id="actaElaboro" type="text" placeholder="Nombre y cargo" class="field mt-1.5" /></label>
      <div class="flex items-end gap-2">
        <button id="btnDocx" class="btn btn-primary flex-1">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> Word
        </button>
        <button id="btnActaPrint" class="btn btn-ghost" title="Imprimir / PDF">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/></svg>
        </button>
      </div>
    </div>
    <div class="card overflow-hidden">
      <div id="actaDoc" class="p-5 sm:p-8 md:p-10"></div>
    </div>
  </section>
</main>

<div class="dock no-print">
  <div class="max-w-[1560px] mx-auto px-3 sm:px-4 py-2 flex flex-wrap items-center gap-x-4 gap-y-0.5 text-[11px]">
    <span class="font-bold">Total</span><span class="num" id="dockTotal"></span>
    <span class="font-bold">Ejecutado</span><span class="num" id="dockEjec" style="color:var(--ok)"></span>
    <span class="font-bold">%</span><span class="num" id="dockPct"></span>
    <span class="ml-auto truncate" style="color:var(--muted)" id="saveHint">Se guarda en este navegador</span>
  </div>
</div>

<div class="toast" id="toast"></div>

    const m = fMuni.value;
    const ests = PIC.estrategias.filter(e => m === 'TODOS' || e.municipio === m);
    fEstr.innerHTML = '<option value="TODAS">Todas las estrategias</option>' +
      ests.map(e => '<option value="' + e.id + '">' + (e.numero ? e.numero + '. ' : '') + e.nombre + (m === 'TODOS' ? ' · ' + e.municipio : '') + '</option>').join('');
  }
  pintarEstrategias();

  fMuni.addEventListener('change', () => { state.municipio = fMuni.value; state.estrategia = 'TODAS'; pintarEstrategias(); render(); });
  fEstr.addEventListener('change', () => { state.estrategia = fEstr.value; render(); });
  $('fEstado').addEventListener('change', e => { state.estado = e.target.value; render(); });
  $('fTexto').addEventListener('input', e => { state.texto = e.target.value.trim(); render(); });
  $('btnSearch').addEventListener('click', () => { showTab('cal'); $('fTexto').focus(); });

  function guardar(){
    const map = {};
    PIC.productos.forEach(p => { if (p.cantidad_ejecutada > 0) map[p.id] = p.cantidad_ejecutada; });
    try { localStorage.setItem(KEY, JSON.stringify(map)); } catch(e){}
    $('saveHint').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
    $('saveHint').style.color = 'var(--ok)';
    setTimeout(() => { $('saveHint').textContent = 'Se guarda en este navegador'; $('saveHint').style.color = ''; }, 2400);
  }

  function pintarKPIs(){
    const a = agregar(filtrar(PIC.productos, state));
    $('kTotal').textContent = fmtCOP(a.total);
    $('kPeso').textContent = fmtPct(a.total / TOTAL) + ' del total';
    $('kEjec').textContent = fmtCOP(a.ejec);
    $('kPend').textContent = 'Pendiente ' + fmtCOP(a.total - a.ejec);
    $('kPct').textContent = fmtPct(a.pct);
    $('kPct').style.color = COL(a.pct);
    $('kBar').style.width = Math.min(100, a.pct*100) + '%';
    $('kBar').style.background = GRAD(a.pct);
    $('kpiPct').className = 'kpi ' + (a.pct >= 0.999 ? 'ok' : a.pct >= 0.5 ? '' : a.pct > 0 ? 'warn' : 'bad');
    $('kProds').textContent = a.productos;
    $('kProdsAv').textContent = a.conAvance + ' con avance';
    $('kUnid').textContent = fmtNum(a.unidades);
    $('kUnidAv').textContent = fmtNum(a.unidadesEj) + ' ejecutadas';
    const g = agregar(PIC.productos);
    $('dockTotal').textContent = fmtCOP(g.total);
    $('dockEjec').textContent = fmtCOP(g.ejec);
    $('dockPct').textContent = fmtPct(g.pct);
    $('dockPct').style.color = COL(g.pct);
    return a;
  }

  function render(){
    const items = filtrar(PIC.productos, state);
    const cont = $('contenedor');
    cont.innerHTML = '';
    pintarKPIs();
    if (!items.length){
      cont.innerHTML = '<div class="card p-10 text-center" style="color:var(--muted)">No hay productos con esos filtros.</div>';
      return;
    }
    const orden = [], grupos = new Map();
    items.forEach(p => {
      if (!grupos.has(p.estrategia)){
        grupos.set(p.estrategia, { id: p.estrategia, nombre: p.estrategia_nombre, numero: p.estrategia_numero, municipio: p.municipio, items: [] });
        orden.push(p.estrategia);
      }
      grupos.get(p.estrategia).items.push(p);
    });

    orden.forEach(id => {
      const g = grupos.get(id);
      const ga = agregar(g.items);
      const det = document.createElement('details');
      det.className = 'strat fade';
      det.dataset.grupo = id;
      det.open = (state.estrategia !== 'TODAS') || orden.length <= 4;

      const sum = document.createElement('summary');
      sum.className = 'p-3 sm:p-4';
      sum.innerHTML =
        '<div class="flex items-stretch gap-3">' +
          '<div class="strip" style="background:' + GRAD(ga.pct) + '"></div>' +
          '<div class="flex-1 min-w-0">' +
            '<div class="flex flex-wrap items-center gap-x-2 gap-y-1">' +
              '<svg class="shrink-0" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>' +
              '<span class="font-bold text-[12.5px] leading-snug">' + (g.numero ? g.numero + '. ' : '') + g.nombre + '</span>' +
              '<span class="chip">' + g.municipio + '</span>' +
            '</div>' +
            '<div class="text-[10.5px] mt-0.5" style="color:var(--muted)">' + ga.productos + ' productos · ' + fmtNum(ga.unidades) + ' unidades · peso ' + fmtPct(ga.total/TOTAL,2) + '</div>' +
            '<div class="bar mt-2 max-w-[360px]"><span data-gbar="' + id + '" style="width:' + Math.min(100,ga.pct*100) + '%;background:' + GRAD(ga.pct) + '"></span></div>' +
          '</div>' +
          '<div class="text-right shrink-0 hidden xs:block">' +
            '<div class="text-[12.5px] font-extrabold num whitespace-nowrap">' + fmtCOP(ga.total) + '</div>' +
            '<div class="text-[13px] font-extrabold num" data-gpct="' + id + '" style="color:' + COL(ga.pct) + '">' + fmtPct(ga.pct) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flex flex-wrap items-center gap-2 mt-2.5 pl-[17px]">' +
          '<span class="text-[11px] font-bold num" style="color:' + COL(ga.pct) + '">' + fmtPct(ga.pct) + '</span>' +
          '<span class="text-[10.5px]" style="color:var(--muted)">' + fmtCOP(ga.ejec) + ' ejecutado</span>' +
          '<span class="no-print ml-auto flex gap-1.5">' +
            '<button data-fill="' + id + '" data-val="1" class="text-[10px] font-bold px-2 py-1 rounded-md" style="background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)">100%</button>' +
            '<button data-fill="' + id + '" data-val="0" class="text-[10px] font-bold px-2 py-1 rounded-md" style="background:var(--surface3);color:var(--muted);border:1px solid var(--border)">0%</button>' +
          '</span>' +
        '</div>';
      det.appendChild(sum);

      const wrap = document.createElement('div');
      wrap.className = 'tblwrap';
      wrap.style.borderTop = '1px solid var(--border)';
      const table = document.createElement('table');
      table.innerHTML =
        '<thead><tr>' +
          '<th style="width:40px">#</th><th style="min-width:280px">Entregable / producto</th>' +
          '<th style="width:80px">Mes</th><th style="width:56px">Cant.</th><th style="width:78px">Ejec.</th>' +
          '<th style="width:110px">Vr. unitario</th><th style="width:124px">Valor total</th>' +
          '<th style="width:68px">Peso</th><th style="width:120px">Ejecutado</th><th style="width:66px">%</th>' +
        '</tr></thead><tbody></tbody>';
      const tb = table.querySelector('tbody');
      g.items.forEach(p => {
        const tr = document.createElement('tr');
        const pct = pctProducto(p);
        tr.innerHTML =
          '<td class="num text-[10.5px]" style="color:var(--muted)">' + p.id + '</td>' +
          '<td><div class="font-semibold text-[12px]">' + (p.entregable || '(sin entregable)') + '</div>' +
          '<div class="text-[10.5px] mt-0.5" style="color:var(--muted)">' + (p.actividad || '') + '</div></td>' +
          '<td><span class="chip">' + p.mes + '</span></td>' +
          '<td class="num">' + fmtNum(p.cantidad) + '</td>' +
          '<td class="num"><input class="cant' + (p.cantidad_ejecutada > 0 ? ' filled' : '') + '" type="number" min="0" max="' + p.cantidad + '" step="any" value="' + p.cantidad_ejecutada + '" data-id="' + p.id + '"></td>' +
          '<td class="num" style="color:var(--text2)">' + fmtCOP(p.vr_unitario) + '</td>' +
          '<td class="num font-bold">' + fmtCOP(p.vr_total) + '</td>' +
          '<td class="num text-[10.5px]" style="color:var(--muted)">' + fmtPct(pesoNacional(p),2) + '</td>' +
          '<td class="num" data-ejec="' + p.id + '">' + fmtCOP(ejecutadoDe(p)) + '</td>' +
          '<td class="num font-bold" data-pct="' + p.id + '" style="color:' + COL(pct) + '">' + fmtPct(pct) + '</td>';
        tb.appendChild(tr);
      });
      const tf = document.createElement('tfoot');
      tf.innerHTML = '<tr><td colspan="6">Subtotal ' + g.nombre + '</td>' +
        '<td class="num" data-gtotal="' + id + '">' + fmtCOP(ga.total) + '</td>' +
        '<td class="num text-[10.5px]">' + fmtPct(ga.total/TOTAL,2) + '</td>' +
        '<td class="num" data-gejec="' + id + '">' + fmtCOP(ga.ejec) + '</td>' +
        '<td class="num" data-gpct2="' + id + '">' + fmtPct(ga.pct) + '</td></tr>';
      table.appendChild(tf);
      wrap.appendChild(table);
      det.appendChild(wrap);
      cont.appendChild(det);
    });

    cont.querySelectorAll('input.cant').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = Number(inp.dataset.id);
        const p = PIC.productos.find(x => x.id === id);
        if (!p) return;
        let v = Number(inp.value);
        if (!isFinite(v) || v < 0) v = 0;
        if (v > p.cantidad) { v = p.cantidad; inp.value = v; }
        p.cantidad_ejecutada = v;
        inp.classList.toggle('filled', v > 0);
        const celda = cont.querySelector('[data-ejec="' + id + '"]');
        const cpct = cont.querySelector('[data-pct="' + id + '"]');
        if (celda) celda.textContent = fmtCOP(ejecutadoDe(p));
        const pct = pctProducto(p);
        if (cpct){ cpct.textContent = fmtPct(pct); cpct.style.color = COL(pct); }
        actualizarGrupo(p.estrategia);
        pintarKPIs();
        guardar();
      });
    });

    cont.querySelectorAll('button[data-fill]').forEach(btn => {
      btn.addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const gid = btn.dataset.fill, val = btn.dataset.val === '1';
        PIC.productos.filter(p => p.estrategia === gid).forEach(p => { p.cantidad_ejecutada = val ? p.cantidad : 0; });
        guardar(); render();
        toast(val ? 'Estrategia marcada al 100 %' : 'Estrategia en cero');
      });
    });
  }

  function actualizarGrupo(gid){
    const det = document.querySelector('details[data-grupo="' + gid + '"]');
    if (!det) return;
    const a = agregar(PIC.productos.filter(p => p.estrategia === gid));
    const set = (sel, txt) => { const el = det.querySelector(sel); if (el) el.textContent = txt; };
    set('[data-gtotal="' + gid + '"]', fmtCOP(a.total));
    set('[data-gejec="' + gid + '"]', fmtCOP(a.ejec));
    set('[data-gpct2="' + gid + '"]', fmtPct(a.pct));
    const gp = det.querySelector('[data-gpct="' + gid + '"]');
    if (gp){ gp.textContent = fmtPct(a.pct); gp.style.color = COL(a.pct); }
    const bar = det.querySelector('[data-gbar="' + gid + '"]');
    if (bar){ bar.style.width = Math.min(100,a.pct*100) + '%'; bar.style.background = GRAD(a.pct); }
    const strip = det.querySelector('.strip');
    if (strip) strip.style.background = GRAD(a.pct);
  }

  $('btnXlsx').addEventListener('click', () => {
    const items = filtrar(PIC.productos, state);
    const rows = [['Municipio','Estrategia','No.','Entregable','Actividad','Mes','Cantidad','Cantidad ejecutada','Valor unitario','Valor total','Peso %','Ejecutado','% ejecución']];
    items.forEach(p => rows.push([p.municipio, p.estrategia_nombre, p.estrategia_numero || '', p.entregable, p.actividad, p.mes,
      Number(p.cantidad), Number(p.cantidad_ejecutada), Number(p.vr_unitario), Number(p.vr_total),
      Number((pesoNacional(p)*100).toFixed(3)), Number(ejecutadoDe(p)), Number((pctProducto(p)*100).toFixed(1))]));
    const a = agregar(items);
    rows.push([]);
    rows.push(['TOTAL','','','','','', Number(a.unidades), Number(a.unidadesEj), '', Number(a.total), Number((a.total/TOTAL*100).toFixed(3)), Number(a.ejec), Number((a.pct*100).toFixed(2))]);
    const bytes = buildXLSX([{ name:'Calificación', rows: rows, widths:[16,30,5,52,44,10,9,11,13,14,9,14,10] }]);
    descargar(bytes, 'PIC_2026_' + (state.municipio === 'TODOS' ? 'TODOS' : state.municipio) + '.xlsx',
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('Excel generado (.xlsx)');
  });

  $('btnPrint').addEventListener('click', () => window.print());
  $('btnReset').addEventListener('click', () => {
    if (!confirm('¿Borrar todos los avances registrados en este navegador?')) return;
    PIC.productos.forEach(p => p.cantidad_ejecutada = 0);
    try { localStorage.removeItem(KEY); } catch(e){}
    render(); toast('Avances restablecidos');
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); showTab('cal'); $('fTexto').focus(); }
  });

  render();
  pintarKPIs();
}

function showTab(name){
  ['cal','res','acta'].forEach(t => {
    const sec = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (sec) sec.classList.toggle('hidden', t !== name);
    document.querySelectorAll('[data-tab="' + t + '"]').forEach(b => b.classList.toggle('on', t === name));
  });
  if (name === 'res') renderResumen();
  if (name === 'acta') renderActa();
  try { if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name); } catch(e) {}
}

function resumenMatriz(){
  const munis = PIC.municipios;
  const nombres = [];
  PIC.productos.forEach(p => { if (nombres.indexOf(p.estrategia_nombre) === -1) nombres.push(p.estrategia_nombre); });
  const filas = nombres.map(nombre => {
    const celdas = munis.map(m => {
      const ids = PIC.estrategias.filter(e => e.municipio === m && e.nombre === nombre).map(e => e.id);
      const items = PIC.productos.filter(p => ids.indexOf(p.estrategia) !== -1);
      return items.length ? agregar(items) : null;
    });
    return { nombre: nombre, celdas: celdas, total: agregar(PIC.productos.filter(p => p.estrategia_nombre === nombre)) };
  });
  return { munis: munis, filas: filas,
           porMuni: munis.map(m => agregar(PIC.productos.filter(p => p.municipio === m))),
           global: agregar(PIC.productos) };
}

function actaData(){
  const sel = document.getElementById('actaMuni');
  if (sel && !sel.options.length){
    sel.innerHTML = '<option value="TODOS">Todos los municipios</option>' +
      PIC.municipios.map(m => '<option value="' + m + '">' + m + '</option>').join('');
  }
  const fec = document.getElementById('actaFecha');
  if (fec && !fec.value){
    const d = new Date();
    fec.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const muni = (sel && sel.value) || 'TODOS';
  const items = PIC.productos.filter(p => muni === 'TODOS' || p.municipio === muni);
  const ids = [];
  items.forEach(p => { if (ids.indexOf(p.estrategia) === -1) ids.push(p.estrategia); });
  const filas = ids.map(id => {
    const its = items.filter(p => p.estrategia === id);
    const a = agregar(its);
    const e = PIC.estrategias.find(x => x.id === id) || {};
    return { nombre: (e.numero ? e.numero + '. ' : '') + (e.nombre || ''), muni: e.municipio || '', a: a };
  });
  return { muni: muni, fecha: (fec && fec.value) || '', items: items, filas: filas,
           global: agregar(items), elaboro: (document.getElementById('actaElaboro') || {}).value || '' };
}

    '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">' +
      '<div class="rounded-xl px-4 py-3" style="background:var(--surface3);border:1px solid var(--border)"><div class="lbl">Municipio</div><div class="text-[13px] font-bold">' + (A.muni === 'TODOS' ? 'Todos' : A.muni) + '</div></div>' +
      '<div class="rounded-xl px-4 py-3" style="background:var(--surface3);border:1px solid var(--border)"><div class="lbl">Fecha de corte</div><div class="text-[13px] font-bold">' + fechaTxt + '</div></div>' +
      '<div class="rounded-xl px-4 py-3" style="background:var(--surface3);border:1px solid var(--border)"><div class="lbl">Avance global</div><div class="text-[13px] font-bold" style="color:' + COL(g.pct) + '">' + fmtPct(g.pct) + '</div></div>' +
    '</div>' +
    '<div class="tblwrap"><table class="mb-4"><thead><tr><th>Estrategia</th><th style="width:120px">Municipio</th><th class="num" style="width:120px">Valor</th><th class="num" style="width:120px">Ejecutado</th><th class="num" style="width:68px">%</th></tr></thead>' +
    '<tbody>' + filas + '</tbody>' +
    '<tfoot><tr><td colspan="2">TOTAL</td><td class="num">' + fmtCOP(g.total) + '</td><td class="num">' + fmtCOP(g.ejec) + '</td><td class="num">' + fmtPct(g.pct) + '</td></tr></tfoot></table></div>' +
    '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-[11.5px]">' +
      '<div>Productos evaluados: <strong>' + g.productos + ' de ' + A.items.length + '</strong></div>' +
      '<div>Unidades ejecutadas: <strong>' + fmtNum(g.unidadesEj) + ' de ' + fmtNum(g.unidades) + '</strong></div>' +
      '<div>Pendiente por ejecutar: <strong>' + fmtCOP(g.total - g.ejec) + '</strong></div>' +
    '</div>' +
    '<div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mt-12 text-[11px]">' +
      '<div style="border-top:1px solid var(--border2);padding-top:6px">Elaboró<br><span class="font-semibold">' + A.elaboro + '</span></div>' +
      '<div style="border-top:1px solid var(--border2);padding-top:6px">Revisó · coordinación PIC</div>' +
      '<div style="border-top:1px solid var(--border2);padding-top:6px">Aprobó · gerencia E.S.E.</div>' +
    '</div>';
}

if (typeof document !== 'undefined') initApp();

document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
document.getElementById('btnActaPrint').addEventListener('click', () => window.print());
document.getElementById('actaMuni').addEventListener('change', renderActa);
document.getElementById('actaFecha').addEventListener('change', renderActa);
document.getElementById('actaElaboro').addEventListener('input', renderActa);

document.getElementById('btnDocx').addEventListener('click', () => {
  const A = actaData();
  const fechaTxt = A.fecha ? A.fecha.split('-').reverse().join('/') : '';
  const doc = {
    paras: [
      { text: 'E.S.E. NORTE 3 — MUNICIPIO DE PADILLA (CAUCA)', align: 'center', size: 18, color: '69809F', bold: true },
      { text: 'ACTA DE CALIFICACIÓN DE PRODUCTOS — PIC 2026', align: 'center', size: 30, bold: true },
      { text: 'COAIC 2026 · conforme a la matriz PIC de la E.S.E. Norte 3', align: 'center', size: 18, color: '69809F', spaceAfter: 240 },
      { text: 'Municipio: ' + (A.muni === 'TODOS' ? 'Todos' : A.muni), size: 20 },
      { text: 'Fecha de corte: ' + fechaTxt, size: 20 },
      { text: 'Avance global del corte: ' + fmtPct(A.global.pct), size: 20, spaceAfter: 200 }
    ],
    table: {
      widths: [3200, 1500, 1500, 1500, 900],
      rows: [['Estrategia', 'Municipio', 'Valor', 'Ejecutado', '%']].concat(
        A.filas.map(f => [f.nombre, f.muni, fmtCOP(f.a.total), fmtCOP(f.a.ejec), fmtPct(f.a.pct)])
      ).concat([
        ['TOTAL', '', fmtCOP(A.global.total), fmtCOP(A.global.ejec), fmtPct(A.global.pct)]
      ])
    },
    after: [
      { text: 'Productos evaluados: ' + A.global.productos + ' de ' + A.items.length, size: 18 },
      { text: 'Unidades ejecutadas: ' + fmtNum(A.global.unidadesEj) + ' de ' + fmtNum(A.global.unidades), size: 18 },
      { text: 'Pendiente por ejecutar: ' + fmtCOP(A.global.total - A.global.ejec), size: 18, spaceAfter: 700 },
      { text: '________________________________________', size: 18, spaceAfter: 0 },
      { text: 'Elaboró: ' + A.elaboro, size: 18, spaceAfter: 500 },
      { text: '________________________________________', size: 18, spaceAfter: 0 },
      { text: 'Revisó · coordinación PIC', size: 18, spaceAfter: 500 },
      { text: '________________________________________', size: 18, spaceAfter: 0 },
      { text: 'Aprobó · gerencia E.S.E.', size: 18 }
    ]
  };
  const bytes = buildDOCX(doc);
  descargar(bytes, 'ACTA_PIC_2026_' + (A.muni === 'TODOS' ? 'TODOS' : A.muni) + '.docx',
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  toast('Acta generada en Word (.docx)');
});

document.getElementById('btnXlsxRes').addEventListener('click', () => {
  const R = resumenMatriz();
  const rows = [['Estrategia','Estrategia No.'].concat(R.munis).concat(['Total valor','Total ejecutado','Total %'])];
  R.filas.forEach(f => {
    rows.push([f.nombre, ''].concat(f.celdas.map(c => c ? Number(c.total) : '')).concat([
      Number(f.total.total), Number(f.total.ejec), Number((f.total.pct*100).toFixed(2))]));
  });
  const tot = ['TOTAL',''].concat(R.porMuni.map(a => Number(a.total))).concat([
    Number(R.global.total), Number(R.global.ejec), Number((R.global.pct*100).toFixed(2))]);
  rows.push([]);
  rows.push(tot);
  rows.push([]);
  rows.push(['Municipio','Valor','Ejecutado','% ejecución']);
  R.munis.forEach((m, i) => rows.push([m, Number(R.porMuni[i].total), Number(R.porMuni[i].ejec), Number((R.porMuni[i].pct*100).toFixed(2))]));
  const bytes = buildXLSX([{ name:'Resumen', rows: rows, widths:[34,12,18,18,18,18,18,18] }]);
  descargar(bytes, 'PIC_2026_resumen.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('Resumen en Excel (.xlsx)');
});

showTab((location.hash || '#cal').replace('#',''));

try {
  if (new URLSearchParams(location.search).get('debug') === '1'){
    setTimeout(() => {
      const de = document.documentElement;
      const ov = de.scrollWidth > window.innerWidth + 1;
      document.title = 'W=' + window.innerWidth + ' SW=' + de.scrollWidth + ' OVERFLOW=' + (ov ? 'SI' : 'no');
    }, 700);
  }
} catch(e) {}
/*==END-UI==*/
</script>
</body>
</html>
